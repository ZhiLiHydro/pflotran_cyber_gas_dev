# Discrete adjoint of MODE GIRT_DAE, alone and with MODE RICHARDS_DAE flow:
# each registered deck's forward solution and the costs and gradients of its
# adjoint (the Adjoint section of the regression file) against a gold. The
# finite-difference checks of the gradients are adjoint_verify.cfg.
[suites]
standard = adjoint-extensions adjoint-coupled adjoint-applications
standard_parallel = adjoint-extensions-np2 adjoint-coupled-np2
                    adjoint-applications-np2

[default-test-criteria]
time = 50 percent
generic = 1.e-8 relative
concentration = 1.e-12 absolute
discrete = 0 absolute
# below 1e-18 a rate near equilibrium is round-off
rate = 1.e-6 relative, min_threshold 1.e-18
volume_fraction = 1.e-12 absolute
pressure = 1.e-8 relative
saturation = 1.e-10 absolute
charge balance = 1.e-12 absolute

[adjoint-extensions]
input_arguments = -tran_ts_adapt_type none

[adjoint-extensions-np2]
np = 2
input_arguments = -tran_ts_adapt_type none -tran_ksp_type gmres -tran_pc_type bjacobi -tran_schur_sub_pc_type lu -tran_ksp_rtol 1e-13

[adjoint-coupled]
input_arguments = -tran_ts_adapt_type none -ts_model_newton_kappa 1e-4

[adjoint-coupled-np2]
np = 2
input_arguments = -tran_ts_adapt_type none -ts_model_newton_kappa 1e-4 -tran_ksp_type gmres -tran_ksp_rtol 1e-13

[adjoint-applications]
input_arguments = -tran_ts_adapt_type none -ts_model_newton_kappa 1e-4

[adjoint-applications-np2]
np = 2
input_arguments = -tran_ts_adapt_type none -ts_model_newton_kappa 1e-4 -tran_ksp_type gmres -tran_ksp_rtol 1e-13
