# Finite-difference and behavioral checks of the discrete adjoint of MODE
# GIRT_DAE, alone and with MODE RICHARDS_DAE flow. Each case runs its deck,
# then a check_*.py post-processor compares the gradients with finite
# differences (see README.md). They take minutes, so they run with make
# verify, not make test; adjoint.cfg checks the decks against golds.
[suites]
standard = adjoint adjoint-extensions adjoint-coupled adjoint-applications
standard_parallel = adjoint-np2 adjoint-extensions-np2 adjoint-coupled-np2
                    adjoint-applications-np2

[default-test-criteria]
generic = 1.e-8 relative

[adjoint]
skip_check_regression = True
skip_check_gold = True
python_post_process_script = check_adjoint.py
input_arguments = -tran_ts_adapt_type none
timeout = 900

[adjoint-np2]
np = 2
skip_check_regression = True
skip_check_gold = True
python_post_process_script = check_adjoint.py
input_arguments = -tran_ts_adapt_type none -tran_ksp_type gmres -tran_pc_type bjacobi -tran_schur_sub_pc_type lu -tran_ksp_rtol 1e-13
timeout = 900

[adjoint-extensions]
skip_check_regression = True
skip_check_gold = True
python_post_process_script = check_extensions.py
input_arguments = -tran_ts_adapt_type none
timeout = 900

[adjoint-extensions-np2]
np = 2
skip_check_regression = True
skip_check_gold = True
python_post_process_script = check_extensions.py
input_arguments = -tran_ts_adapt_type none -tran_ksp_type gmres -tran_pc_type bjacobi -tran_schur_sub_pc_type lu -tran_ksp_rtol 1e-13
timeout = 900

[adjoint-coupled]
skip_check_regression = True
skip_check_gold = True
python_post_process_script = check_coupled.py
input_arguments = -tran_ts_adapt_type none -ts_model_newton_kappa 1e-4
timeout = 900

[adjoint-coupled-np2]
np = 2
skip_check_regression = True
skip_check_gold = True
python_post_process_script = check_coupled.py
input_arguments = -tran_ts_adapt_type none -ts_model_newton_kappa 1e-4 -tran_ksp_type gmres -tran_ksp_rtol 1e-13
timeout = 900

[adjoint-applications]
skip_check_regression = True
skip_check_gold = True
python_post_process_script = check_applications.py
input_arguments = -tran_ts_adapt_type none -ts_model_newton_kappa 1e-4
timeout = 900

[adjoint-applications-np2]
np = 2
skip_check_regression = True
skip_check_gold = True
python_post_process_script = check_applications.py
input_arguments = -tran_ts_adapt_type none -ts_model_newton_kappa 1e-4 -tran_ksp_type gmres -tran_ksp_rtol 1e-13
timeout = 900
