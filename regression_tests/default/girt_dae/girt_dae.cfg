[suites]
standard = tracer_dae
           tracer_cyclic_dae
           calcite_dae
           calcite_log_dae
           microbial_dae
           microbial_log_dae
           vanishing_log_dae
           abcd_dae
           mixed_implicit_dae
           sorption_mr_dae
           sorption_vf_dae
           sorption_den_dae
           srfcplx_negative_dae
           decay_sorbed_dae
           mineral_trace_dae
           headspace_dae
standard_parallel = truncation_one_rank-np2

[default-test-criteria]
time = 50 percent
generic = 1.e-8 relative
concentration = 1.e-12 absolute
discrete = 0 absolute
# below 1e-18 a rate near equilibrium is round-off
rate = 1.e-6 relative, min_threshold 1.e-18
volume_fraction = 1.e-12 absolute
pressure = 1.e-8 relative
saturation = 1.e-10 absolute
charge balance = 1.e-12 absolute

[tracer_dae]

[tracer_cyclic_dae]

[calcite_dae]

[calcite_log_dae]

[microbial_dae]

[microbial_log_dae]

[vanishing_log_dae]
# order 1 keeps the gold independent of BDF order lowering
input_arguments = -tran_ts_bdf_order 1

[abcd_dae]

[mixed_implicit_dae]

[sorption_mr_dae]

[sorption_vf_dae]

[sorption_den_dae]

[srfcplx_negative_dae]

[decay_sorbed_dae]

[mineral_trace_dae]

[truncation_one_rank-np2]
np=2
input_arguments = -tran_ts_type beuler -tran_ts_adapt_type none

