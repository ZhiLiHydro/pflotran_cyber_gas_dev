# MODE RICHARDS_DAE. The case runs the deck (default adaptive BDF) against
# its gold; check_richards_dae.py compares backward Euler with classic
# RICHARDS and checks the model.
[suites]
standard = richards_dae

[default-test-criteria]
time = 50 percent
generic = 1.e-8 relative
discrete = 0 absolute
pressure = 1.e-8 relative
saturation = 1.e-10 absolute

[richards_dae]
python_post_process_script = check_richards_dae.py
timeout = 900
