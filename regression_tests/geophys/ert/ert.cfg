[suites]
standard = ert 
           ert_block
           ert_flow 
           ert_flow_dataset
           ert_flow_transport
           ert_dataset
           ert_inversion
           ert_zflow
standard_parallel = ert-np4 
                    ert_block-np4
                    ert_transport-np4
                    ert_flow_transport_inactive-np4
geophysics = ert 
             ert-np4
             ert_block
             ert_block-np4
             ert_flow 
             ert_flow_dataset
             ert_transport-np4
             ert_flow_transport
             ert_dataset
             ert_flow_transport_inactive-np4
             ert_inversion
             ert_zflow

[default-test-criteria]
# default criteria for all tests, can be overwritten by specific tests
generic = 1.0e-12 absolute

[ert]

[ert-np4]
np = 4

# Exercise the KSPMatSolve() path of PMERTSolve().  "-geop_ksp_type bcgs" is
# given explicitly so that the block size does not pull in HPDDM: with any
# other Krylov method KSPMatSolve() solves for one right-hand side at a time,
# which reproduces the single right-hand side results exactly and does not
# require PETSc to have been configured with HPDDM.
[ert_block]
input_arguments = -geop_solver_block_size 4 -geop_ksp_type bcgs

[ert_block-np4]
np = 4
input_arguments = -geop_solver_block_size 4 -geop_ksp_type bcgs

[ert_flow]

[ert_flow_dataset]
python_setup_script = sec_dataset.py

[ert_transport-np4]
np = 4

[ert_flow_transport]

[ert_zflow]

[ert_flow_transport_inactive-np4]
np = 4

[ert_dataset]
python_setup_script = ec_dataset.py

[ert_inversion]
regression_filename_root = ert_forwardRun5
