[suites]
standard = ml_bthuber
           ml_node_phi
           ml_node_min_lin
           ml_node_min
ml_surrogate = ml_bthuber
               ml_node_phi
               ml_node_min_lin
               ml_node_min

[default-test-criteria]
# the surrogate output stages use exp/sinh/tanh; keep a relative criterion so
# a different compiler's libm does not fail the test, while any change of the
# contract (feature order, transform chain, update rule) still does
time = 300 percent
generic = 1.0e-9 relative
concentration = 1.0e-9 relative
discrete = 0 absolute
rate = 1.0e-9 relative
volume_fraction = 1.0e-9 relative
pressure = 1.0e-9 relative
saturation = 1.0e-12 absolute

