[suites]
# 0-D single-cell decks (~0.1 s each): the surrogate's inputs are constant, so every
# gold file is certified independently by ml_surrogate_oracle.py (numpy, from the weight
# file alone).  These are the tests that run in `make test` (standard).
standard = ml0d_bthuber
           ml0d_node_phi
           ml0d_node_min_lin
           ml0d_node_min
ml_surrogate = ml0d_bthuber
               ml0d_node_phi
               ml0d_node_min_lin
               ml0d_node_min
# 1-D katdiss run.1 decks (300 y, ~15 s each): coupled integration checks, run on demand
# with `make ml_surrogate_1d`; their gold files are self-consistency only.
ml_surrogate_1d = ml_bthuber
                  ml_node_phi
                  ml_node_min_lin
                  ml_node_min

[default-test-criteria]
# the surrogate output stages use exp/sinh/tanh; keep a relative criterion so
# a different compiler's libm does not fail the test, while any change of the
# contract (feature order, transform chain, update rule) still does
time = 300 percent
generic = 1.0e-9 relative
concentration = 1.0e-9 relative
discrete = 0 absolute
rate = 1.0e-9 relative
volume_fraction = 1.0e-9 relative
pressure = 1.0e-9 relative
saturation = 1.0e-12 absolute

