[suites]
# TODO: wire mms_steady_2d and mms_transient_2d into the regression harness
#       once gold files are generated and verified.
#
# TODO: The following tests are disabled due to pre-existing convergence
#       failures (SNES_DIVERGED_MAX_IT).  They need solver tuning before
#       they can be re-enabled:
#         stokes_uniform/stokes_uniform
#         stokes_uniform/stokes_ts_uniform
#         stokes_uniform/stokes_uniform_conv
#         stokes_uniform/stokes_ts_uniform_conv
#
# TODO: stokes_cylinder/stokes_cylinder is disabled because the input deck
#       uses PRESCRIBED_BC which is not yet implemented in the Stokes
#       condition reader.
#
# TODO: stokes_patch/stokes_patch_pressure is disabled because the Stokes
#       solver produces zero velocities for the pressure-driven patch test
#       (only pressure BCs on inflow/outflow faces).  The post-process script
#       detects this and exits with error code 1, which also crashes the
#       regression framework preventing subsequent tests from running.

standard = pointer
           stokes_patch/stokes_patch
           stokes_patch/stokes_patch_dirichlet
           stokes_lid/stokes_transient
           stokes_lid/stokes_ts_transient
           stokes_lid_transport/stokes_transport
           stokes_lid_transport/stokes_ts_transient

# TODO: Re-enable parallel tests once serial counterparts all pass and
#       parallel gold files are regenerated.  The stokes_lid and
#       stokes_lid_transport/stokes_transport parallel gold files are stale
#       (from Feb 2025) and need regeneration with mpiexec.
#standard_parallel = stokes_lid/stokes_transient-np4
#                    stokes_lid/stokes_ts_transient-np4
#                    stokes_lid_transport/stokes_transport-np4

runtime =  pointer

[default-test-criteria]
# default criteria for all tests, can be overwritten by specific tests
time = 50 percent
generic = 1.0e-12 relative
concentration = 1.0e-12 absolute
discrete = 0 absolute
rate = 1.0e-12 absolute
volume fraction = 1.0e-12 absolute
pressure = 1.0e-12 relative
saturation = 1.0e-12 absolute
charge balance = 1.0e-12 absolute

[array_bounds]
planned_error = True
input_arguments = -throw_error array_bounds

[pointer]
planned_error = True
input_arguments = -throw_error pointer

[stokes_patch/stokes_patch]
skip_check_regression = True
skip_check_gold = True
python_post_process_script = stokes_patch/check_stokes_patch_velocity.py

[stokes_patch/stokes_patch_pressure]
skip_check_regression = True
skip_check_gold = True
python_post_process_script = stokes_patch/check_stokes_patch_pressure.py

[stokes_patch/stokes_patch_dirichlet]
skip_check_regression = True
skip_check_gold = True
python_post_process_script = stokes_patch/check_stokes_patch_dirichlet.py

[stokes_cylinder/stokes_cylinder]
skip_check_gold = True

[stokes_uniform/stokes_uniform]
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_uniform/stokes_uniform-np2]
np=2
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_uniform/stokes_ts_uniform]
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_uniform/stokes_ts_uniform-np2]
np=2
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_uniform/stokes_uniform_conv]
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_uniform/stokes_uniform_conv-np2]
np=2
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_uniform/stokes_ts_uniform_conv]
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_uniform/stokes_ts_uniform_conv-np2]
np=2
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_lid/stokes_transient]
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_lid/stokes_ts_transient]
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_lid/stokes_transient-np4]
np=4
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_lid/stokes_ts_transient-np4]
np=4
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_lid_transport/stokes_transport]
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_lid_transport/stokes_ts_transient]
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_lid_transport/stokes_transport-np4]
np=4
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_lid_transport/stokes_ts_transient-np4]
np=4
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute
