[suites]
standard = array_bounds
           pointer
           stokes_uniform/stokes_uniform
           stokes_uniform/stokes_ts_uniform
           stokes_uniform/stokes_uniform_conv
           stokes_uniform/stokes_ts_uniform_conv
           stokes_lid/stokes_transient
           stokes_lid/stokes_ts_transient
           stokes_lid_transport/stokes_transport
           stokes_lid_transport/stokes_ts_transient

standard_parallel = stokes_uniform/stokes_uniform-np2
                    stokes_uniform/stokes_ts_uniform-np2
                    stokes_uniform/stokes_uniform_conv-np2
                    stokes_uniform/stokes_ts_uniform_conv-np2
                    stokes_lid/stokes_transient-np4
                    stokes_lid/stokes_ts_transient-np4
                    stokes_lid_transport/stokes_transport-np4
                    stokes_lid_transport/stokes_ts_transient-np4

runtime =  array_bounds
           pointer

[default-test-criteria]
# default criteria for all tests, can be overwritten by specific tests
time = 50 percent
generic = 1.0e-12 relative
concentration = 1.0e-12 absolute
discrete = 0 absolute
rate = 1.0e-12 absolute
volume fraction = 1.0e-12 absolute
pressure = 1.0e-12 relative
saturation = 1.0e-12 absolute
charge balance = 1.0e-12 absolute

[array_bounds]
planned_error = True
input_arguments = -throw_error array_bounds

[pointer]
planned_error = True
input_arguments = -throw_error pointer

[stokes_uniform/stokes_uniform]
pressure = 1.0e-10 absolute
generic = 1.0e-10 absolute

[stokes_uniform/stokes_uniform-np2]
